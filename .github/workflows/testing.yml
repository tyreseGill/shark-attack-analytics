name: Testing

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    testing:
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                python-version: ["3.11"]
        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout the code
              uses: actions/checkout@v4

            - name: Setup python environment
              uses: actions/setup-python@v5
              with:
                python-version: ${{matrix.python-version}}
                cache: pip
                cache-dependency-path: server/requirements.txt

            - name: Install application dependencies
              run: pip install -r server/requirements.txt

            - name: Install kaggle dependencies
              run: python -m pip install kaggle six

            - name: Download Shark Attack Dataset
              run: |
                python -m kaggle datasets download felipeesc/shark-attack-dataset --path server/data/raw --unzip

            # NOTE: Uncomment when Postgresql instance is available on OS system
            # - name: Run integration tests
            #   run: python -m pytest server/tests/integration/

            - name: Run system tests
              run: python -m pytest server/tests/system/

            - name: Run unit tests
              run: python -m pytest server/tests/unit/

            - name: Test jupyter notebooks
              run: python -m pytest --nbmake docs/
        